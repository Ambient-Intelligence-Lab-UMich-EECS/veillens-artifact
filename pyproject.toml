[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veillens"
version = "0.1.0"
description = "Explainable mitigation of VLM-based visual privacy risk"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["privacy", "vision-language-models", "image-anonymisation", "inpainting"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core: enough to validate a config and score a finished run. Deliberately excludes torch, so
# `--dry-run`, `veillens-score` and the test suite work on a laptop with no GPU.
dependencies = [
    "openai>=1.40",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    # On Python 3.14, every numpy up to 2.2.6 silently corrupts an operand in compound
    # expressions like `c - a*a` once the array exceeds 256 KiB (numpy's temporary-elision
    # threshold): `a` comes back holding `a*a`. Verified corrupted 2.0.2 -> 2.2.6, clean
    # 2.3.5 / 2.4.6 / 2.5.2. Python 3.10-3.13 are unaffected, so the floor only rises on 3.14+.
    "numpy>=1.24; python_version < '3.14'",
    "numpy>=2.3.5; python_version >= '3.14'",
    "pillow>=10,<12",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Grounding: open-set detection + segmentation. SAM 2 and GroundingDINO are not on PyPI and come
# from the third_party/Grounded-SAM-2 submodule -- see docs/USAGE.md.
ground = ["torch>=2.1", "torchvision>=0.16", "timm>=1.0", "supervision>=0.22",
          "opencv-python>=4.9", "hydra-core>=1.3", "omegaconf>=2.3", "addict", "yapf"]
# Editing: the diffusion stack.
edit = ["torch>=2.1", "diffusers>=0.30", "transformers>=4.44", "accelerate>=0.34",
        "safetensors>=0.4", "controlnet-aux>=0.0.7"]
# The five prior-work baselines. opencv covers rand-noise and ocr-blur; the rest is mm-pgd
# (Places365 ResNets + Grad-CAM) and geoshield (CLIP surrogates from the submodule).
baselines = ["torch>=2.1", "torchvision>=0.16", "transformers>=4.44", "opencv-python>=4.9",
             "grad-cam>=1.5", "scipy>=1.11"]
dev = ["pytest>=8.0", "ruff>=0.6"]
# Everything a full GPU run needs.
all = ["veillens[ground,edit,baselines]"]

[project.scripts]
veillens-protect = "veillens.cli.protect:main"
veillens-baseline = "veillens.cli.baseline:main"
veillens-score = "veillens.cli.score:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
veillens = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
